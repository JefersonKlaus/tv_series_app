version: '3.3'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: tvseries_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d tvseries_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "7777:7777"
    environment:
      - DATABASE_URL=postgresql://app_user:app_password@db:5432/tvseries_db
      - HF_API_KEY=${HF_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: